packages:
  - apps/*
  - packages/*
  - spikes/*
  - trigger
overrides:
  jose: 6.2.9
  kysely: 0.29.5
  'ws@>=8.0.0 <8.21.0': 8.21.3
  'undici@>=8.0.0 <8.12.3': 8.12.3
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  # GHSA-67mh-4wv8-2f99 (esbuild <=0.24.2; ruling 253). drizzle-kit 0.31.10
  # declares @esbuild-kit/esm-loader, whose core-utils asks for esbuild
  # ~0.18.20, but no file drizzle-kit publishes loads that loader: migrate and
  # generate load drizzle-kit's own esbuild, 0.25.12, the version given here.
  # The selector names core-utils alone, so the trigger.dev CLI's esbuild
  # 0.23.1, which bundles the Trigger.dev worker, does not move.
  '@esbuild-kit/core-utils>esbuild': 0.25.12
allowBuilds:
  '@depot/cli': false
  '@prisma/client': false
  better-sqlite3: false
  esbuild: false
  puppeteer: false
minimumReleaseAgeExclude:
  - '@cueplusplus/tokens@0.3.0 || 0.13.0 || 0.14.0 || 0.14.1'
  - '@cueplusplus/ui@0.3.0 || 0.13.0 || 0.14.0 || 0.14.1'
  - lucide-react@1.33.0
  - '@cueplusplus/theme-base@1.0.2 || 1.0.3'
  - '@cueplusplus/theme-cue@1.0.2 || 1.0.3'
  - '@cueplusplus/theme-dusk@1.0.2 || 1.0.3'
  - '@cueplusplus/theme-hivehub@1.0.2 || 1.0.3'
  - '@cueplusplus/theme-luma@1.0.2 || 1.0.3'
  - '@cueplusplus/theme-signal@1.0.2 || 1.0.3'
  - '@cueplusplus/theme-snuffle@1.0.2 || 1.0.3'
  - '@cueplusplus/theme-terminal@1.0.2 || 1.0.3'
  - '@cueplusplus/theme-tools@1.0.3 || 1.0.4'
  - '@cueplusplus/theme-venu@1.0.2 || 1.0.3'
# Every peer this workspace depends on is declared explicitly. Optional
# @cueplusplus/ui peer groups belong to subpaths RequestPort does not import
# (charts, flow, date, color, carousel, instruments/data-table and
# instruments/log-viewer), so auto-installing them would pull an unreviewed
# dependency surface no source file can reach. Add one back together with the
# subpath that needs it.
#
# The cost of this setting is that a *non-optional* peer is installed only
# where a manifest declares it, and a frozen install reports nothing when one
# is missing — the dependent simply fails at run time. Root `puppeteer` is
# declared for exactly that reason: `@mermaid-js/mermaid-cli` requires it
# without a `peerDependenciesMeta` entry, and `pnpm docs:diagrams` dies with
# ERR_MODULE_NOT_FOUND without it. `scripts/workspace-contract.test.mjs`
# asserts every non-optional peer of every root and `apps/web` dependency
# resolves, so the next omission fails `pnpm test` instead of a command.
autoInstallPeers: false
